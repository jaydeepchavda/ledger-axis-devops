name: LedgerAxis CI/CD

# PIPELINE TRIGGERS
on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


# PERMISSIONS
permissions:
  contents: read


# GLOBAL VARIABLES
env:
  BACKEND_IMAGE: jaydipaws/ledgeraxis-backend
  FRONTEND_IMAGE: jaydipaws/ledgeraxis-frontend


jobs:

  # BACKEND CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    # PostgreSQL required by database integration tests
    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: ledgeraxis
          POSTGRES_USER: ledgeraxis
          POSTGRES_PASSWORD: ledgeraxis_pass

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U ledgeraxis -d ledgeraxis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Environment used by the backend and migration scripts
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ledgeraxis
      PGUSER: ledgeraxis
      PGPASSWORD: ledgeraxis_pass
      PGSSLMODE: disable
      PGSCHEMA: public

    steps:

      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install exact dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Create database schema
      - name: Run migrations
        working-directory: backend
        run: npm run migrate

      # Run backend unit + integration + DB tests
      - name: Run tests
        working-directory: backend
        run: npm test


  # FRONTEND CI

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:

      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install exact dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Run frontend tests
      - name: Run tests
        working-directory: frontend
        run: npm test -- --watch=false

      # Verify production Angular build
      - name: Build application
        working-directory: frontend
        run: npm run build


  # ==========================================================
  # BUILD + PUSH DOCKER IMAGES
  # ==========================================================

  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    # Do not build/push images until BOTH CI jobs pass
    needs:
      - backend-ci
      - frontend-ci

    # Only publish from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:git-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      # Build and push frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:git-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest