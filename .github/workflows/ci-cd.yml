name: ci 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    backend:
        runs-on: ubuntu-latest

        steps: 
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup node js
              uses: actions/setup-node@v4
              with:
                node-version: 24

            - name: install backend dependencies
              working-directory: backend
              run: npm ci

            - name: run backend tests
              working-directory: backend
              run: npm test

    frontend:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24


            - name: install frontend dependcies
              working-directory: frontend
              run: npm ci
            
            - name: Build frontend
              working-directory: frontend
              run: npm run build

