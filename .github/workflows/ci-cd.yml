name: LedgerAxis CI/CD

# ============================================================
# WHEN DOES THIS PIPELINE RUN?
# ============================================================

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  BACKEND_IMAGE: YOUR_DOCKER_USERNAME/ledgeraxis-backend
  FRONTEND_IMAGE: YOUR_DOCKER_USERNAME/ledgeraxis-frontend


jobs:

  # ==========================================================
  # BACKEND CI
  # ==========================================================

  backend-ci:

    name: Backend CI

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Environment variables used by backend tests
    # --------------------------------------------------------

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ledgeraxis
      PGUSER: ledgeraxis
      PGPASSWORD: ledgeraxis_pass
      PGSSLMODE: disable
      PGSCHEMA: public

    # --------------------------------------------------------
    # PostgreSQL service required by DB integration tests
    # --------------------------------------------------------

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: ledgeraxis
          POSTGRES_USER: ledgeraxis
          POSTGRES_PASSWORD: ledgeraxis_pass

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U ledgeraxis -d ledgeraxis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # 2. Install Node.js 24
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ------------------------------------------------------
      # 3. Install backend dependencies
      # ------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci


      # ------------------------------------------------------
      # 4. Run database migrations
      # ------------------------------------------------------

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate


      # ------------------------------------------------------
      # 5. Run backend tests
      # ------------------------------------------------------

      - name: Run backend tests
        working-directory: backend
        run: npm test


      # ------------------------------------------------------
      # 6. Build backend Docker image
      #
      # push=false means:
      # Build image for validation but do NOT publish it.
      # ------------------------------------------------------

      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ledgeraxis-backend:test


  # ==========================================================
  # FRONTEND CI
  # ==========================================================

  frontend-ci:

    name: Frontend CI

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # 2. Install Node.js 24
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # ------------------------------------------------------
      # 3. Install frontend dependencies
      # ------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      # ------------------------------------------------------
      # 4. Run frontend tests
      # ------------------------------------------------------

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false


      # ------------------------------------------------------
      # 5. Build Angular application
      # ------------------------------------------------------

      - name: Build Angular application
        working-directory: frontend
        run: npm run build


      # ------------------------------------------------------
      # 6. Build frontend Docker image
      #
      # push=false means:
      # Build image for validation but do NOT publish it.
      # ------------------------------------------------------

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ledgeraxis-frontend:test


  # ==========================================================
  # DOCKER BUILD + PUSH
  #
  # This job runs ONLY after:
  #
  # Backend CI   -> PASS
  # Frontend CI  -> PASS
  #
  # AND
  #
  # The code was pushed to main.
  # ==========================================================

  docker-publish:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    # --------------------------------------------------------
    # Only publish images from main.
    # Feature branches only run CI.
    # --------------------------------------------------------

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'


    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # ------------------------------------------------------
      # 2. Login to Docker Hub
      #
      # Credentials come from GitHub repository secrets.
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------------------
      # 3. Setup Docker Buildx
      # ------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ------------------------------------------------------
      # 4. Build and push backend image
      # ------------------------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v7

        with:

          # Backend Docker build context
          context: ./backend

          # Backend Dockerfile
          file: ./backend/Dockerfile

          # Push image to Docker Hub
          push: true

          # Immutable Git commit tag
          tags: |
            ${{ env.BACKEND_IMAGE }}:git-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main

          # GitHub Actions Docker build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # Generate build provenance
          provenance: true

          # Generate SBOM
          sbom: true


      # ------------------------------------------------------
      # 5. Build and push frontend image
      # ------------------------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v7

        with:

          # Frontend Docker build context
          context: ./frontend

          # Frontend Dockerfile
          file: ./frontend/Dockerfile

          # Push image to Docker Hub
          push: true

          # Immutable Git commit tag
          tags: |
            ${{ env.FRONTEND_IMAGE }}:git-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main

          # GitHub Actions Docker build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # Generate build provenance
          provenance: true

          # Generate SBOM
          sbom: true